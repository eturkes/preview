[project]
name = "preview-tool"
version = "0.1.0"
description = "Generate evidence-grounded bilingual project dashboards with Codex."
requires-python = ">=3.11"
license = "Apache-2.0 WITH LLVM-exception"

[tool.ruff]
line-length = 100
